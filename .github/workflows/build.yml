name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        sketch: [firmware/XenithOS, firmware/beta-1/XenithOS]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install U8g2 NTPClient Time "TOTP library" Base32-Decode
      - name: Compile ${{ matrix.sketch }}
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ${{ matrix.sketch }}
