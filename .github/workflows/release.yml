name: Release

# Publishing a release on GitHub builds the current firmware and attaches it
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the firmware to'
        required: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP8266 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266
          arduino-cli lib install U8g2 NTPClient Time "TOTP library" Base32-Decode
      - name: Compile
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir out firmware/XenithOS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/XenithOS.ino.bin xenithos-esp8266.bin
          gh release upload "$TAG" xenithos-esp8266.bin --clobber
